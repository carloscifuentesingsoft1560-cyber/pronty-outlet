{% extends 'base.html' %}

{% block title %}
{{ page_title }} | Pronty Outlet
{% endblock %}

{% block content %}

<section class="content-page">

    <div class="container content-page__container">

        <header class="content-page__header">

            <div class="content-page__icon">

                <i data-lucide="{{ page_icon }}"></i>

            </div>

            <div>

                <span class="content-page__eyebrow">
                    {{ page_eyebrow }}
                </span>

                <h1>
                    {{ page_title }}
                </h1>

            </div>

        </header>


        <div class="content-page__body">

            {% block page_content %}
            {% endblock %}

        </div>

    </div>

</section>


<style>

    .content-page {
        padding:
            4.5rem 0;

        background:
            linear-gradient(
                180deg,
                #fffaf5 0%,
                #ffffff 100%
            );

        min-height:
            60vh;
    }


    .content-page__container {
        max-width:
            980px;
    }


    .content-page__header {
        display:
            flex;

        align-items:
            center;

        gap:
            1rem;

        margin-bottom:
            2.2rem;
    }


    .content-page__icon {
        width:
            60px;

        height:
            60px;

        display:
            grid;

        place-items:
            center;

        flex-shrink:
            0;

        border-radius:
            18px;

        background:
            rgba(
                31,
                92,
                74,
                0.1
            );

        color:
            #1f5c4a;
    }


    .content-page__icon svg {
        width:
            28px;

        height:
            28px;
    }


    .content-page__eyebrow {
        display:
            block;

        margin-bottom:
            0.35rem;

        color:
            #f04c8b;

        font-size:
            0.85rem;

        font-weight:
            800;

        text-transform:
            uppercase;

        letter-spacing:
            0.06em;
    }


    .content-page__header h1 {
        margin:
            0;

        color:
            #1f5c4a;

        font-size:
            clamp(
                2rem,
                5vw,
                3rem
            );

        line-height:
            1.05;
    }


    .content-page__body {
        display:
            grid;

        gap:
            1.25rem;
    }


    .content-card {
        padding:
            1.7rem;

        border-radius:
            22px;

        background:
            #ffffff;

        border:
            1px solid
            rgba(
                31,
                92,
                74,
                0.08
            );

        box-shadow:
            0 10px 28px
            rgba(
                0,
                0,
                0,
                0.055
            );
    }


    .content-card h2 {
        margin:
            0 0
            0.75rem;

        color:
            #1f5c4a;

        font-size:
            1.3rem;
    }


    .content-card h3 {
        margin:
            1.3rem 0
            0.55rem;

        color:
            #1f5c4a;

        font-size:
            1.05rem;
    }


    .content-card p {
        margin:
            0 0
            0.9rem;

        color:
            #5f5f5f;

        line-height:
            1.65;
    }


    .content-card p:last-child {
        margin-bottom:
            0;
    }


    .content-card ul,
    .content-card ol {
        margin:
            0.7rem 0
            0;

        padding-left:
            1.25rem;

        color:
            #5f5f5f;

        line-height:
            1.7;
    }


    .content-card li + li {
        margin-top:
            0.45rem;
    }


    .content-card a:not(.btn) {
        color:
            #1f5c4a;

        font-weight:
            700;
    }


    .content-card--highlight {
        background:
            linear-gradient(
                145deg,
                rgba(
                    31,
                    92,
                    74,
                    0.98
                ),
                rgba(
                    31,
                    92,
                    74,
                    0.9
                )
            );

        color:
            #ffffff;
    }


    .content-card--highlight h2,
    .content-card--highlight h3 {
        color:
            #ffffff;
    }


    .content-card--highlight p,
    .content-card--highlight li {
        color:
            rgba(
                255,
                255,
                255,
                0.82
            );
    }


    .content-card--highlight a:not(.btn) {
        color:
            #d8b25b;
    }


    .content-card .btn--primary {
        color:
            #ffffff;
    }


    .content-card .btn--secondary {
        color:
            #1f5c4a;
    }


    .content-card--highlight .btn--secondary {
        background-color:
            #ffffff;

        color:
            #1f5c4a;

        border-color:
            #d8b25b;
    }


    .content-actions {
        display:
            flex;

        flex-wrap:
            wrap;

        gap:
            0.8rem;

        margin-top:
            1.2rem;
    }


    .faq-item {
        padding:
            1.1rem 0;

        border-bottom:
            1px solid
            rgba(
                31,
                92,
                74,
                0.1
            );
    }


    .faq-item:first-child {
        padding-top:
            0;
    }


    .faq-item:last-child {
        padding-bottom:
            0;

        border-bottom:
            0;
    }


    .faq-item h3 {
        margin:
            0 0
            0.45rem;
    }


    @media (
        max-width: 640px
    ) {

        .content-page {
            padding:
                3rem 0;
        }


        .content-page__header {
            align-items:
                flex-start;
        }


        .content-page__icon {
            width:
                52px;

            height:
                52px;
        }


        .content-card {
            padding:
                1.35rem;
        }


        .content-actions {
            flex-direction:
                column;
        }


        .content-actions .btn {
            width:
                100%;
        }

    }

</style>

{% endblock %}
